<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thosbook - Management System</title>
  
  <!-- Custom CSS Theme -->
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  
  <!-- Single Page Application Root Element -->
  <div id="root"></div>

  <!-- Vite Entry Point (ใช้ type="module" เพื่อให้ Vite Bundle JSX ได้ถูกต้อง) -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
