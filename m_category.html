<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thosbook - Category List</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { navy: '#0c3d88', darkNavy: '#041c43', footerNavy: '#02132e', accentOrange: '#fee1ce', pageBg: '#e9ecef' }
          },
          fontFamily: { montserrat: ['Montserrat', 'sans-serif'], prompt: ['Prompt', 'sans-serif'] }
        }
      }
    }
  </script>
</head>

<body class="bg-brand-pageBg font-montserrat min-h-screen flex flex-col pb-24">

  <!-- TOP HEADER NAVBAR -->
  <header class="bg-brand-navy text-white px-6 py-5 flex items-center justify-between shadow-md sticky top-0 z-30 w-full">
    <a href="m_dashboard.html" class="text-3xl font-extrabold tracking-tight">Logo</a>
    <div class="text-right">
      <div id="header-user-name" class="text-base font-semibold leading-tight">Thosapon</div>
      <div id="header-user-role" class="text-xs text-blue-200">Admin</div>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="flex-1 px-5 py-6 w-full">
    <!-- CATEGORY CARD CONTAINER (DYNAMIC RENDER) -->
    <div id="mobile-category-container" class="bg-white rounded-3xl p-6 shadow-sm space-y-3 border border-gray-100 w-full">
      <div class="text-center py-8 text-gray-400 text-sm">กำลังโหลดหมวดหมู่...</div>
    </div>
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-brand-navy text-white px-4 py-3 flex items-center justify-around shadow-2xl z-40 w-full">
    <a href="m_dashboard.html" class="flex flex-col items-center gap-1 opacity-70 hover:opacity-100 transition-opacity">
      <i data-lucide="home" class="w-6 h-6"></i>
      <span class="text-xs font-medium">Home</span>
    </a>
    <a href="m_category.html" class="flex flex-col items-center gap-1 opacity-100 text-white">
      <i data-lucide="star" class="w-6 h-6"></i>
      <span class="text-xs font-medium">Category</span>
    </a>
    <a href="admin-manage.html" class="flex flex-col items-center gap-1 opacity-70 hover:opacity-100 transition-opacity">
      <i data-lucide="user" class="w-6 h-6"></i>
      <span class="text-xs font-medium">Account</span>
    </a>
    <button onclick="handleLogout()" class="flex flex-col items-center gap-1 opacity-70 hover:opacity-100 transition-opacity">
      <i data-lucide="layout-grid" class="w-6 h-6"></i>
      <span class="text-xs font-medium">Anothers</span>
    </button>
  </nav>

  <!-- ADD CATEGORY MODAL -->
  <div id="category-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-brand-darkNavy">New Category</h3>
        <button onclick="closeCategoryModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="handleSaveCategory(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Category Name</label>
          <input type="text" id="cat-name" required placeholder="ชื่อหมวดหมู่..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Icon Color</label>
          <input type="color" id="cat-color" value="#0c3d88" class="w-10 h-10 rounded-xl border-none cursor-pointer bg-transparent" />
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeCategoryModal()" class="w-1/2 bg-gray-100 text-brand-darkNavy font-semibold py-2.5 rounded-xl text-sm">Cancel</button>
          <button type="submit" class="w-1/2 bg-brand-navy text-white font-semibold py-2.5 rounded-xl text-sm shadow-md">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPTS LOAD ORDER -->
  <script src="js/core/config.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/components/mobile-app.js"></script>
</body>
</html>
