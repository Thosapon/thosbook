<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thosbook - Login</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Thosbook Design System CSS -->
  <link rel="stylesheet" href="css/theme.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { navy: '#0c3d88', darkNavy: '#041c43', pageBg: '#e9ecef' } },
          fontFamily: { montserrat: ['Montserrat', 'sans-serif'], prompt: ['Prompt', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-pageBg font-montserrat min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl p-8 shadow-xl max-w-sm w-full space-y-5 border border-gray-100">
    
    <!-- Header Title -->
    <div class="text-center space-y-1">
      <h1 class="text-3xl font-extrabold text-brand-navy tracking-tight">Thosbook</h1>
      <p class="text-xs text-gray-400">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
    </div>

    <!-- Error Alert Box (แสดงผลด้านล่างหัวข้อ) -->
    <div id="error-alert" class="hidden bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl p-3 text-center font-medium leading-relaxed">
      <!-- Error Message Will Render Here -->
    </div>

    <!-- Login Form -->
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Username</label>
        <input 
          type="text" 
          id="username" 
          required 
          placeholder="ชื่อผู้ใช้..." 
          class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy" 
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            required 
            placeholder="รหัสผ่าน..." 
            class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-4 pr-11 py-3 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy" 
          />
          <!-- Eye Toggle Button -->
          <button 
            type="button" 
            onclick="togglePasswordVisibility()" 
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-brand-navy p-1 transition-colors"
            title="Toggle password visibility"
          >
            <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <button 
        type="submit" 
        id="login-btn" 
        class="w-full bg-brand-navy hover:bg-blue-900 text-white font-semibold py-3 rounded-xl text-sm shadow-md transition-all active:scale-98 mt-2"
      >
        เข้าสู่ระบบ
      </button>
    </form>
  </div>

  <!-- Scripts Load Order -->
  <script src="js/core/config.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();
    });

    // Toggle ซ่อน/แสดงรหัสผ่าน
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eye-icon");

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.setAttribute("data-lucide", "eye-off");
      } else {
        passwordInput.type = "password";
        eyeIcon.setAttribute("data-lucide", "eye");
      }
      if (window.lucide) lucide.createIcons();
    }

    // แสดงข้อความ Error ในหน้าจอ (ไม่ใช้ Alert)
    function showError(message) {
      const alertBox = document.getElementById("error-alert");
      if (alertBox) {
        alertBox.innerText = message;
        alertBox.classList.remove("hidden");
      }
    }

    // ซ่อนข้อความ Error
    function hideError() {
      const alertBox = document.getElementById("error-alert");
      if (alertBox) {
        alertBox.classList.add("hidden");
        alertBox.innerText = "";
      }
    }

    // Handle Login Submit
    async function handleLogin(e) {
      e.preventDefault();
      hideError();

      const usernameInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value.trim();
      const submitBtn = document.getElementById("login-btn");

      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังเข้าสู่ระบบ...";

      try {
        const res = await ThosbookAPI.login(usernameInput, passwordInput);

        if (res && res.success) {
          ThosbookAuth.setSession(res.user);
          if (window.innerWidth < 768) {
            window.location.replace("m_dashboard.html");
          } else {
            window.location.replace("dashboard.html");
          }
        } else {
          showError(res.message || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
        }
      } catch (error) {
        console.error("Login Error:", error);
        showError("ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "เข้าสู่ระบบ";
      }
    }
  </script>
</body>
</html>
