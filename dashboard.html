<script>
  // 1. Auth Guard Check (วางไว้จุดแรกสุดเพื่อความปลอดภัย)
  const userSession = localStorage.getItem("thosbook_user");
  if (!userSession) {
    window.location.href = "login.html"; // ถ้ายังไม่ Login ให้เด้งไปหน้า Login
  }

  // 2. ฟังก์ชัน Log out
  function handleLogout() {
    localStorage.removeItem("thosbook_user"); // ลบ Session
    window.location.href = "index.html";
  }
</script>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thosbook - Dashboard</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0c3d88', // Brand.blue.400[cite: 1]
              darkNavy: '#041c43', // Brand.blue.1000[cite: 1]
              footerNavy: '#02132e', 
              accentOrange: '#fee1ce', // Secondary.50[cite: 1]
              pageBg: '#e9ecef', // Neutral.400[cite: 1]
            }
          },
          fontFamily: {
            montserrat: ['Montserrat', 'sans-serif'],
            prompt: ['Prompt', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .sidebar-transition {
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), padding 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-brand-pageBg font-montserrat min-h-screen flex flex-col">

  <!-- Top Navbar -->
  <header class="bg-brand-navy text-white shadow-md">
    <div class="max-w-[1600px] w-full mx-auto px-8 py-4 flex items-center justify-between">
      <!-- Brand Logo -->
      <div class="flex items-center gap-2">
        <i data-lucide="star" class="w-5 h-5 fill-current text-white"></i>
        <span class="text-2xl font-bold tracking-tight">Thosbook</span>
      </div>

      <!-- Search & Logout -->
      <div class="flex items-center gap-6">
        <div class="relative w-80">
          <input 
            type="text" 
            id="search-input"
            placeholder="Search" 
            onkeyup="handleSearch()"
            class="w-full bg-[#154ca3] text-white placeholder-blue-200 text-sm rounded-full py-2 pl-4 pr-10 focus:outline-none focus:ring-2 focus:ring-white/30"
          />
          <i data-lucide="search" class="w-4 h-4 text-blue-200 absolute right-3.5 top-2.5"></i>
        </div>
        <button onclick="handleLogout()" class="flex items-center gap-2 text-sm font-medium hover:text-blue-200 transition-colors">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>Log out</span>
        </button>        
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 flex px-8 py-6 gap-6 max-w-[1600px] w-full mx-auto">
    
    <!-- Collapsible Sidebar -->
    <aside 
      id="sidebar" 
      class="w-64 bg-white rounded-2xl p-4 shadow-sm flex flex-col justify-between shrink-0 sidebar-transition"
    >
      <div class="space-y-2">
        <!-- Sidebar Header & Toggle Button -->
        <div class="flex items-center justify-between pb-2" id="sidebar-header">
          <span class="nav-text text-xs font-semibold text-gray-400 uppercase tracking-wider pl-2">Categories</span>
          <button 
            id="toggle-btn" 
            onclick="toggleSidebar()" 
            class="p-2.5 text-brand-darkNavy hover:bg-gray-100 rounded-xl transition-colors ml-auto shrink-0"
            title="Toggle Sidebar"
          >
            <i data-lucide="panel-left-close" id="toggle-icon" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Navigation Links (Dynamic Render from DB) -->
        <nav class="space-y-1" id="category-nav">
          <!-- Initial Loading State -->
          <div class="text-xs text-gray-400 p-2 nav-text">กำลังโหลดหมวดหมู่...</div>
        </nav>
      </div>

      <!-- Add New Category -->
      <button class="flex items-center justify-center gap-2 text-brand-darkNavy bg-gray-100 hover:bg-gray-200 px-4 py-2.5 rounded-xl font-medium text-sm transition-colors w-full mt-4">
        <i data-lucide="plus-circle" class="w-5 h-5 shrink-0"></i>
        <span class="nav-text truncate">New Category</span>
      </button>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 space-y-4">
      <!-- Top Actions Bar -->
      <div class="flex justify-end">
        <button class="flex items-center gap-2 bg-brand-navy hover:bg-blue-900 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition-colors">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>New Category</span>
        </button>
      </div>

      <!-- Dynamic Cards Grid -->
      <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="col-span-full text-center py-12 text-brand-darkNavy font-medium">
          กำลังโหลดข้อมูลจาก Google Sheets...
        </div>
      </div>
    </main>

  </div>

  <!-- Footer -->
  <footer class="bg-brand-footerNavy h-32 mt-auto"></footer>

  <!-- Script Section -->
  <script>
    // -------------------------------------------------------------
    // CONFIGURATION
    // -------------------------------------------------------------
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyCCKruqnrzhPSzj35FLVWP9m7aEIuz7gSwVdj5sL6XHgiHf2frXb1lpwGwA6YidtAo/exec"; // วาง Web App URL จาก Google Apps Script ที่นี่

    let isCollapsed = false;
    let allBookmarks = [];
    let currentCategory = 'all';

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      fetchCategories();
      fetchBookmarkData();
    });

    // -------------------------------------------------------------
    // 1. SIDEBAR COLLAPSE FUNCTIONALITY
    // -------------------------------------------------------------
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const navTexts = document.querySelectorAll('.nav-text');
      const navItems = document.querySelectorAll('.nav-item');
      const navIconOnly = document.querySelector('.nav-icon-only');

      isCollapsed = !isCollapsed;

      if (isCollapsed) {
        sidebar.classList.remove('w-64', 'p-4');
        sidebar.classList.add('w-16', 'p-2');

        navTexts.forEach(el => el.classList.add('hidden'));
        navItems.forEach(el => {
          el.classList.remove('px-4');
          el.classList.add('justify-center', 'px-2');
        });

        if (navIconOnly) navIconOnly.classList.replace('hidden', 'flex');
      } else {
        sidebar.classList.remove('w-16', 'p-2');
        sidebar.classList.add('w-64', 'p-4');

        navTexts.forEach(el => el.classList.remove('hidden'));
        navItems.forEach(el => {
          el.classList.remove('justify-center', 'px-2');
          el.classList.add('px-4');
        });

        if (navIconOnly) navIconOnly.classList.replace('flex', 'hidden');
      }
    }

    // -------------------------------------------------------------
    // 2. FETCH CATEGORIES (SIDEBAR)
    // -------------------------------------------------------------
    async function fetchCategories() {
      const navContainer = document.getElementById("category-nav");
      if (!navContainer) return;

      try {
        const response = await fetch(`${GAS_API_URL}?action=getCategories`);
        const categories = await response.json();

        let allItemsHtml = `
          <a href="#" onclick="filterByCategory('all', this)" class="nav-icon-only hidden justify-center items-center text-brand-darkNavy bg-brand-accentOrange p-2.5 rounded-xl font-medium text-sm transition-colors mb-2">
            <i data-lucide="layout-grid" class="w-5 h-5"></i>
          </a>
          <button onclick="filterByCategory('all', this)" class="category-btn nav-text w-full flex items-center gap-3 bg-brand-accentOrange text-brand-darkNavy px-4 py-2.5 rounded-xl font-semibold text-sm mb-1">
            <i data-lucide="layout-grid" class="w-4 h-4 shrink-0"></i>
            <span class="truncate">All Items</span>
          </button>
        `;

        let categoriesHtml = "";
        if (Array.isArray(categories)) {
          categories.forEach((cat) => {
            categoriesHtml += `
              <button onclick="filterByCategory('${cat.id}', this)" 
                 class="category-btn nav-item w-full flex items-center gap-3 text-brand-darkNavy hover:bg-gray-50 px-4 py-2.5 rounded-xl font-medium text-sm transition-colors">
                <i data-lucide="folder" class="w-5 h-5 shrink-0" style="color: ${cat.color || 'inherit'}"></i>
                <span class="nav-text truncate">${cat.name}</span>
              </button>
            `;
          });
        }

        navContainer.innerHTML = allItemsHtml + categoriesHtml;
        lucide.createIcons();

        if (isCollapsed) {
          document.querySelectorAll('.nav-text').forEach(el => el.classList.add('hidden'));
          document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.remove('px-4');
            el.classList.add('justify-center', 'px-2');
          });
        }
      } catch (error) {
        console.error("Error fetching categories:", error);
      }
    }

    // -------------------------------------------------------------
    // 3. FETCH BOOKMARKS DATA
    // -------------------------------------------------------------
    async function fetchBookmarkData() {
      const container = document.getElementById('cards-container');

      try {
        const response = await fetch(`${GAS_API_URL}?action=getBookmarks`);
        allBookmarks = await response.json();

        renderBookmarks(allBookmarks);
      } catch (error) {
        console.error("Error fetching bookmarks:", error);
        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-red-500 font-medium">
            เกิดข้อผิดพลาดในการโหลดข้อมูล กรุณาตรวจสอบ GAS_API_URL
          </div>
        `;
      }
    }

    // -------------------------------------------------------------
    // 4. RENDER BOOKMARK CARDS
    // -------------------------------------------------------------
    function renderBookmarks(data) {
      const container = document.getElementById('cards-container');
      if (!container) return;

      if (!Array.isArray(data) || data.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-500">
            ไม่พบข้อมูล Bookmark ในรายการนี้
          </div>
        `;
        return;
      }

      container.innerHTML = "";
      data.forEach((item) => {
        const cardHtml = `
          <div class="bg-white rounded-2xl p-6 shadow-sm min-h-[180px] flex flex-col justify-between hover:shadow-md transition-shadow">
            <div>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-brand-accentOrange text-brand-darkNavy inline-block mb-3">
                ${item.type || 'Link'}
              </span>
              <h3 class="text-base font-semibold text-brand-darkNavy line-clamp-2">
                ${item.title || 'ไม่มีหัวข้อ'}
              </h3>
              <p class="text-sm text-gray-600 mt-2 line-clamp-3">
                ${item.content || ''}
              </p>
            </div>
            <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center text-sm font-medium text-brand-darkNavy">
              <span>${item.url ? new URL(item.url).hostname : ''}</span>
              ${item.url ? `<a href="${item.url}" target="_blank" class="text-brand-navy hover:underline">เปิดลิงก์ ↗</a>` : ''}
            </div>
          </div>
        `;
        container.insertAdjacentHTML("beforeend", cardHtml);
      });
    }

    // -------------------------------------------------------------
    // 5. FILTER & SEARCH HANDLERS
    // -------------------------------------------------------------
    function filterByCategory(catId, element) {
      currentCategory = catId;

      // Update UI active state on Sidebar
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('bg-brand-accentOrange', 'font-semibold');
        btn.classList.add('hover:bg-gray-50', 'font-medium');
      });
      if (element) {
        element.classList.remove('hover:bg-gray-50', 'font-medium');
        element.classList.add('bg-brand-accentOrange', 'font-semibold');
      }

      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('search-input').value.toLowerCase();

      const filtered = allBookmarks.filter(item => {
        const matchCategory = (currentCategory === 'all') || (item.category_id === currentCategory);
        const matchSearch = (item.title && item.title.toLowerCase().includes(query)) ||
                            (item.content && item.content.toLowerCase().includes(query));
        return matchCategory && matchSearch;
      });

      renderBookmarks(filtered);
    }
  </script>
</body>
</html>
