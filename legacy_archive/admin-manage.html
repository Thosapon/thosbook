<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thosbook - User Management</title>

  <!-- Admin Role Guard Check -->
  <script>
    const userSession = JSON.parse(localStorage.getItem("thosbook_user") || "null");
    const isAdminUser = userSession && (
      (userSession.role && userSession.role.toString().toLowerCase() === "admin") || 
      (userSession.username && userSession.username.toString().toLowerCase() === "admin")
    );

    if (!isAdminUser) {
      alert("คุณไม่มีสิทธิ์เข้าถึงหน้านี้ (สำหรับ Admin เท่านั้น)");
      window.location.href = "dashboard.html";
    }

    function handleLogout() {
      localStorage.removeItem("thosbook_user");
      window.location.href = "index.html";
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { navy: '#0c3d88', darkNavy: '#041c43', footerNavy: '#02132e', accentOrange: '#fee1ce', pageBg: '#e9ecef' }
          },
          fontFamily: { montserrat: ['Montserrat', 'sans-serif'], prompt: ['Prompt', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    .sidebar-transition { transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), padding 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>

<body class="bg-brand-pageBg font-montserrat min-h-screen flex flex-col">

  <!-- TOP NAVBAR -->
  <header class="bg-brand-navy text-white shadow-md">
    <div class="max-w-[1600px] w-full mx-auto px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i data-lucide="star" class="w-5 h-5 fill-current text-white"></i>
        <span class="text-2xl font-bold tracking-tight">Thosbook</span>
        <span class="bg-red-500 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider ml-2">Admin Panel</span>
      </div>

      <div class="flex items-center gap-4">
        <a href="dashboard.html" class="flex items-center gap-1.5 bg-white/10 hover:bg-white/20 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition-colors shadow-sm">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>Back to Dashboard</span>
        </a>

        <button onclick="handleLogout()" class="flex items-center gap-2 text-sm font-medium hover:text-blue-200 transition-colors ml-2">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>Log out</span>
        </button>        
      </div>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="flex-1 flex px-8 py-6 gap-6 max-w-[1600px] w-full mx-auto">
    
    <!-- Collapsible Sidebar -->
    <aside id="sidebar" class="w-64 bg-white rounded-2xl p-4 shadow-sm flex flex-col justify-between shrink-0 sidebar-transition">
      <div class="space-y-3">
        
        <!-- User Profile Header -->
        <div class="flex items-center justify-between pb-3 border-b border-gray-100" id="sidebar-header">
          <div id="user-profile-sidebar" class="flex items-center gap-2.5 min-w-0">
            <div id="user-avatar" class="w-8 h-8 rounded-full bg-brand-navy text-white font-bold flex items-center justify-center text-xs shadow-sm shrink-0">A</div>
            <div class="nav-text flex flex-col min-w-0">
              <span id="user-display-name" class="text-xs font-bold text-brand-darkNavy truncate leading-tight">Admin User</span>
              <span id="user-display-role" class="text-[10px] font-semibold text-red-500 capitalize truncate">Admin</span>
            </div>
          </div>

          <button id="toggle-btn" onclick="toggleSidebar()" class="p-1.5 text-brand-darkNavy hover:bg-gray-100 rounded-xl transition-colors shrink-0 ml-auto" title="Toggle Sidebar">
            <i data-lucide="panel-left-close" id="toggle-icon" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Sidebar Admin Navigation -->
        <nav class="space-y-1">
          <a href="#" class="w-full flex items-center gap-3 bg-brand-accentOrange text-brand-darkNavy px-4 py-2.5 rounded-xl font-semibold text-sm">
            <i data-lucide="users" class="w-4 h-4 shrink-0"></i>
            <span class="nav-text truncate">User Accounts</span>
          </a>
        </nav>
      </div>

      <button onclick="openAddUserModal()" class="flex items-center justify-center gap-2 text-brand-darkNavy bg-gray-100 hover:bg-gray-200 px-4 py-2.5 rounded-xl font-medium text-sm transition-colors w-full mt-4">
        <i data-lucide="user-plus" class="w-5 h-5 shrink-0"></i>
        <span class="nav-text truncate">New User</span>
      </button>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 space-y-6">
      
      <!-- USER MANAGEMENT SECTION -->
      <section class="space-y-4">
        <div class="flex items-center justify-between border-b border-gray-200 pb-3">
          <div>
            <h2 class="text-lg font-bold text-brand-darkNavy">User Management</h2>
            <p class="text-xs text-gray-500 mt-0.5">จัดการ บัญชีผู้ใช้งาน สิทธิ์การเข้าถึง และรหัสผ่านในระบบ</p>
          </div>
          <button onclick="openAddUserModal()" class="flex items-center gap-2 bg-brand-navy hover:bg-blue-900 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-sm transition-colors">
            <i data-lucide="user-plus" class="w-4 h-4"></i>
            <span>Add New User</span>
          </button>
        </div>

        <!-- USER CARDS GRID -->
        <div id="admin-user-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          <div class="col-span-full text-center py-12 text-gray-400 text-sm">กำลังโหลดข้อมูลผู้ใช้...</div>
        </div>
      </section>

    </main>

  </div>

  <footer class="bg-brand-footerNavy h-32 mt-auto"></footer>

  <!-- MODALS SECTION -->
  <!-- ADD / EDIT USER MODAL -->
  <div id="user-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl border border-gray-100 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <h3 id="user-modal-title" class="text-lg font-bold text-brand-darkNavy">New User</h3>
        <button onclick="closeUserModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="user-form" onsubmit="handleSaveUser(event)" class="space-y-4">
        <input type="hidden" id="user-id" />
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Full Name</label>
          <input type="text" id="user-fullname" required placeholder="ชื่อ-นามสกุล..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Username</label>
          <input type="text" id="user-username" required placeholder="username" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Password</label>
          <input type="password" id="user-password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Role</label>
          <select id="user-role" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy">
            <option value="viewer">Viewer (อ่านอย่างเดียว)</option>
            <option value="admin">Admin (จัดการได้ทุกส่วน)</option>
          </select>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeUserModal()" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-brand-darkNavy font-semibold py-2.5 rounded-xl text-sm transition-colors">Cancel</button>
          <button type="submit" id="save-user-btn" class="w-1/2 bg-brand-navy hover:bg-blue-900 text-white font-semibold py-2.5 rounded-xl text-sm shadow-md transition-colors">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
