<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thosbook - Notification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="css/theme.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { navy: '#0c3d88', darkNavy: '#041c43', pageBg: '#f4f4f4' } },
          fontFamily: { montserrat: ['Montserrat', 'sans-serif'], prompt: ['Prompt', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-pageBg font-prompt min-h-screen flex flex-col antialiased">

  <header class="mobile-top-nav text-white px-5 flex items-center justify-between shadow-sm sticky top-0 z-30 w-full shrink-0">
    <a href="m_dashboard.html" class="text-white p-1 hover:opacity-80 transition-opacity">
      <i data-lucide="arrow-left" class="w-6 h-6"></i>
    </a>
    <h1 class="text-lg font-bold font-montserrat tracking-tight">Notification</h1>
    <div class="w-6"></div>
  </header>

  <main class="flex-1 p-5 w-full space-y-4">
    <h2 class="text-center font-bold text-brand-darkNavy text-base font-montserrat">My Notification</h2>

    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden divide-y divide-gray-100">
      <a href="m_notification_detail.html?id=1" class="flex items-center justify-between p-4 hover:bg-gray-50 transition-colors">
        <div>
          <h3 class="font-bold text-sm text-brand-darkNavy">Title AAAAAAAAAAAAAA</h3>
          <p class="text-xs text-gray-500 mt-1">Description</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] text-gray-400">15:11 PM</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
        </div>
      </a>
    </div>
  </main>

  <script src="js/core/config.js"></script>
  <script src="js/core/auth.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
