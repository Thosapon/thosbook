<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thosbook - Change Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="css/theme.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { navy: '#0c3d88', darkNavy: '#041c43', pageBg: '#f4f4f4', error: '#fe0001' } },
          fontFamily: { montserrat: ['Montserrat', 'sans-serif'], prompt: ['Prompt', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-pageBg font-prompt min-h-screen flex flex-col antialiased">

  <!-- TOP HEADER NAVBAR -->
  <header class="mobile-top-nav text-white px-5 flex items-center justify-between shadow-sm sticky top-0 z-30 w-full shrink-0">
    <a href="m_settings.html" class="text-white p-1 hover:opacity-80 transition-opacity">
      <i data-lucide="arrow-left" class="w-6 h-6"></i>
    </a>
    <h1 class="text-lg font-bold font-montserrat tracking-tight">User Information</h1>
    <div class="w-6"></div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-5 w-full space-y-4">
    <h2 class="text-center font-bold text-brand-darkNavy text-base font-montserrat pt-2">Change My Password</h2>

    <form onsubmit="handleSavePassword(event)" novalidate class="space-y-4 pt-1">
      <!-- Old Password Field -->
      <div>
        <label class="block text-sm font-medium text-brand-darkNavy mb-1.5 font-montserrat">Old Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="old-password-input" 
            placeholder="Enter old password" 
            oninput="resetFieldError(this, 'Enter old password')"
            class="w-full bg-white border border-gray-200 rounded-2xl px-4 py-3.5 text-sm text-brand-darkNavy placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-navy pr-11 transition-colors"
          />
          <i data-lucide="eye" onclick="togglePasswordVisibility('old-password-input', this)" class="w-5 h-5 text-gray-400 absolute right-3.5 top-4 cursor-pointer"></i>
        </div>
      </div>

      <!-- New Password Field -->
      <div>
        <label class="block text-sm font-medium text-brand-darkNavy mb-1.5 font-montserrat">New Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="new-password-input" 
            placeholder="Enter new password" 
            oninput="resetFieldError(this, 'Enter new password')"
            class="w-full bg-white border border-gray-200 rounded-2xl px-4 py-3.5 text-sm text-brand-darkNavy placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-navy pr-11 transition-colors"
          />
          <i data-lucide="eye" onclick="togglePasswordVisibility('new-password-input', this)" class="w-5 h-5 text-gray-400 absolute right-3.5 top-4 cursor-pointer"></i>
        </div>
      </div>

      <!-- Confirm New Password Field -->
      <div>
        <label class="block text-sm font-medium text-brand-darkNavy mb-1.5 font-montserrat">Confirm New Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="confirm-password-input" 
            placeholder="Confirm new password" 
            oninput="resetFieldError(this, 'Confirm new password')"
            class="w-full bg-white border border-gray-200 rounded-2xl px-4 py-3.5 text-sm text-brand-darkNavy placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-navy pr-11 transition-colors"
          />
          <i data-lucide="eye" onclick="togglePasswordVisibility('confirm-password-input', this)" class="w-5 h-5 text-gray-400 absolute right-3.5 top-4 cursor-pointer"></i>
        </div>

        <!-- Password Error Text (Password is not match) -->
        <div id="password-error-msg" class="flex items-center gap-1.5 text-xs text-[#fe0001] mt-2 hidden">
          <i data-lucide="info" class="w-4 h-4"></i>
          <span>Password is not match</span>
        </div>
      </div>

      <!-- Save Button -->
      <button type="submit" class="w-full bg-[#0c3d88] hover:bg-blue-900 text-white font-semibold py-3.5 rounded-full shadow-md mt-6 transition-all active:scale-95">
        Save
      </button>
    </form>
  </main>

  <script src="js/core/auth.js"></script>
  <script>
    lucide.createIcons();

    function handleSavePassword(e) {
      e.preventDefault();
      
      const oldPass = document.getElementById('old-password-input');
      const newPass = document.getElementById('new-password-input');
      const confirmPass = document.getElementById('confirm-password-input');
      const errorMsgBox = document.getElementById('password-error-msg');
      
      let isValid = true;
      errorMsgBox.classList.add('hidden');

      // 1. ตรวจสอบกรณีไม่ได้กรอกข้อมูล
      if (!oldPass.value.trim()) {
        showFieldError(oldPass, 'Please enter Old Password');
        isValid = false;
      }

      if (!newPass.value.trim()) {
        showFieldError(newPass, 'Please enter New Password');
        isValid = false;
      }

      if (!confirmPass.value.trim()) {
        showFieldError(confirmPass, 'Please enter Confirm Password');
        isValid = false;
      }

      // 2. ตรวจสอบกรณีรหัสผ่านใหม่ไม่ตรงกัน (Password is not match)
      if (newPass.value.trim() && confirmPass.value.trim() && newPass.value !== confirmPass.value) {
        errorMsgBox.classList.remove('hidden');
        showFieldError(confirmPass, 'Confirm new password');
        isValid = false;
      }

      // บันทึกสำเร็จ
      if (isValid) {
        ThosbookUI.success('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว').then(() => {
          location.href = 'm_settings.html';
        });
      }
    }

    // แสดง Error State ขอบแดง + Placeholder แดง
    function showFieldError(inputEl, errorMessage) {
      inputEl.value = '';
      inputEl.placeholder = errorMessage;
      inputEl.classList.remove('border-gray-200', 'placeholder:text-gray-400', 'focus:ring-brand-navy');
      inputEl.classList.add('border-[#fe0001]', 'placeholder:text-[#fe0001]', 'text-[#fe0001]', 'focus:ring-[#fe0001]');
    }

    // คืนค่าปกติเมื่อเริ่มพิมพ์
    function resetFieldError(inputEl, defaultPlaceholder) {
      document.getElementById('password-error-msg').classList.add('hidden');
      inputEl.placeholder = defaultPlaceholder;
      inputEl.classList.remove('border-[#fe0001]', 'placeholder:text-[#fe0001]', 'text-[#fe0001]', 'focus:ring-[#fe0001]');
      inputEl.classList.add('border-gray-200', 'placeholder:text-gray-400', 'text-brand-darkNavy', 'focus:ring-brand-navy');
    }

    // สลับเปิด/ปิดตาแสดงรหัสผ่าน
    function togglePasswordVisibility(inputId, iconEl) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        iconEl.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        iconEl.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
