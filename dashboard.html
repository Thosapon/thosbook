<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thosbook - Dashboard</title>

  <!-- Device Redirection Guard (สลับไปหน้า m_dashboard.html เมื่อเปิดบนมือถือ) -->
  <script>
    if (window.innerWidth < 768) {
      window.location.replace("m_dashboard.html");
    }

    const userSession = JSON.parse(localStorage.getItem("thosbook_user") || "null");
    if (!userSession) {
      window.location.href = "index.html";
    }

    function handleLogout() {
      localStorage.removeItem("thosbook_user");
      window.location.href = "index.html";
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- SweetAlert2 CDN (สำหรับ Pop-up Alert สวยงามตาม Design System) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Thosbook Design System CSS -->
  <link rel="stylesheet" href="css/theme.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { navy: '#0c3d88', darkNavy: '#041c43', footerNavy: '#02132e', accentOrange: '#fee1ce', pageBg: '#e9ecef' }
          },
          fontFamily: { montserrat: ['Montserrat', 'sans-serif'], prompt: ['Prompt', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    .sidebar-transition { transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), padding 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>

<body class="bg-brand-pageBg font-montserrat min-h-screen flex flex-col">

  <!-- TOP NAVBAR -->
  <header class="bg-brand-navy text-white shadow-md">
    <div class="max-w-[1600px] w-full mx-auto px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="star" class="w-5 h-5 fill-current text-white"></i>
        <span class="text-2xl font-bold tracking-tight">Thosbook</span>
      </div>

      <div class="flex items-center gap-6">
        <div class="relative w-80">
          <input 
            type="text" 
            id="search-input"
            placeholder="Search" 
            onkeyup="handleSearch()"
            class="w-full bg-[#154ca3] text-white placeholder-blue-200 text-sm rounded-full py-2 pl-4 pr-10 focus:outline-none focus:ring-2 focus:ring-white/30"
          />
          <i data-lucide="search" class="w-4 h-4 text-blue-200 absolute right-3.5 top-2.5"></i>
        </div>

        <div id="admin-link-container" class="hidden">
          <a href="admin-manage.html" class="flex items-center gap-1.5 bg-brand-accentOrange text-brand-darkNavy text-xs font-bold px-3.5 py-2 rounded-xl hover:bg-orange-200 transition-colors shadow-sm">
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span>Admin Manage</span>
          </a>
        </div>

        <button onclick="handleLogout()" class="flex items-center gap-2 text-sm font-medium hover:text-blue-200 transition-colors">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>Log out</span>
        </button>        
      </div>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="flex-1 flex px-8 py-6 gap-6 max-w-[1600px] w-full mx-auto">
    
    <!-- Sidebar -->    
    <aside id="sidebar" class="w-64 h-fit bg-white rounded-2xl p-4 shadow-sm flex flex-col shrink-0 sidebar-transition space-y-4">
      <div class="space-y-3">
        
        <!-- Profile Header บน Sidebar -->
        <div class="flex items-center justify-between pb-3 border-b border-gray-100" id="sidebar-header">
          <div id="user-profile-sidebar" class="flex items-center gap-2.5 min-w-0">
            <div id="user-avatar" class="w-8 h-8 rounded-full bg-brand-navy text-white font-bold flex items-center justify-center text-xs shadow-sm shrink-0">U</div>
            <div class="nav-text flex flex-col min-w-0">
              <span id="user-display-name" class="text-xs font-bold text-brand-darkNavy truncate leading-tight">User Name</span>
              <span id="user-display-role" class="text-[10px] font-semibold text-gray-400 capitalize truncate">Viewer</span>
            </div>
          </div>

          <button id="toggle-btn" onclick="toggleSidebar()" class="p-1.5 text-brand-darkNavy hover:bg-gray-100 rounded-xl transition-colors shrink-0 ml-auto" title="Toggle Sidebar">
            <i data-lucide="panel-left-close" id="toggle-icon" class="w-4 h-4"></i>
          </button>
        </div>

        <nav class="space-y-1" id="category-nav">
          <div class="text-xs text-gray-400 p-2 nav-text">กำลังโหลดหมวดหมู่...</div>
        </nav>
      </div>

      <button onclick="openCategoryModal()" class="flex items-center justify-center gap-2 text-brand-darkNavy bg-gray-100 hover:bg-gray-200 px-4 py-2.5 rounded-xl font-medium text-sm transition-colors w-full mt-4">
        <i data-lucide="plus-circle" class="w-5 h-5 shrink-0"></i>
        <span class="nav-text truncate">New Category</span>
      </button>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 space-y-4">
      <div class="flex justify-end">
        <button onclick="openAddModal()" class="flex items-center gap-2 bg-brand-navy hover:bg-blue-900 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition-colors">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>New Bookmark</span>
        </button>
      </div>

      <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="col-span-full text-center py-12 text-brand-darkNavy font-medium">กำลังโหลดข้อมูลจาก Google Sheets...</div>
      </div>
    </main>

  </div>

  <footer class="bg-brand-footerNavy h-32 mt-auto"></footer>

  <!-- MODALS SECTION -->
  <!-- 1. ADD BOOKMARK MODAL -->
  <div id="add-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl border border-gray-100 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <h3 class="text-lg font-bold text-brand-darkNavy">Add New Bookmark</h3>
        <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="add-bookmark-form" onsubmit="handleAddBookmark(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Type</label>
          <select id="bm-type" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy">
            <option value="link">Link</option>
            <option value="video">Video</option>
            <option value="text">Text / Note</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Category</label>
          <select id="bm-category" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy">
            <option value="">-- เลือกหมวดหมู่ --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Title</label>
          <input type="text" id="bm-title" required placeholder="ชื่อเรื่อง หรือ หัวข้อ..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Link (ถ้ามี)</label>
          <input type="url" id="bm-url" placeholder="https://example.com" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">รูปภาพ (Cover Image)</label>
          <input type="file" id="bm-image-file" accept="image/*" onchange="previewAddImage(event)" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-navy file:text-white hover:file:bg-blue-900 cursor-pointer" />
          <div id="image-preview-container" class="mt-2 hidden">
            <img id="image-preview" src="" alt="Preview" class="h-32 w-full object-cover rounded-xl border border-gray-200 cursor-pointer" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Content / Note</label>
          <textarea id="bm-content" rows="3" placeholder="รายละเอียด หรือ ข้อความสรุป..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy"></textarea>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeAddModal()" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-brand-darkNavy font-semibold py-2.5 rounded-xl text-sm transition-colors">Cancel</button>
          <button type="submit" id="save-bm-btn" class="w-1/2 bg-brand-navy hover:bg-blue-900 text-white font-semibold py-2.5 rounded-xl text-sm shadow-md transition-colors">Save Bookmark</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. EDIT BOOKMARK MODAL -->
  <div id="edit-bm-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl border border-gray-100 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <h3 class="text-lg font-bold text-brand-darkNavy">Edit Bookmark</h3>
        <button onclick="closeEditBmModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="edit-bookmark-form" onsubmit="handleUpdateBookmark(event)" class="space-y-4">
        <input type="hidden" id="edit-bm-id" />
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Type</label>
          <select id="edit-bm-type" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy">
            <option value="link">Link</option>
            <option value="video">Video</option>
            <option value="text">Text / Note</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Category</label>
          <select id="edit-bm-category" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Title</label>
          <input type="text" id="edit-bm-title" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Link (ถ้ามี)</label>
          <input type="url" id="edit-bm-url" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Content / Note</label>
          <textarea id="edit-bm-content" rows="3" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy"></textarea>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeEditBmModal()" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-brand-darkNavy font-semibold py-2.5 rounded-xl text-sm transition-colors">Cancel</button>
          <button type="submit" id="update-bm-btn" class="w-1/2 bg-brand-navy hover:bg-blue-900 text-white font-semibold py-2.5 rounded-xl text-sm shadow-md transition-colors">Update Bookmark</button>
        </div>
      </form>
    </div>
  </div>

<!-- 3. ADD/EDIT CATEGORY MODAL -->
  <div id="category-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl border border-gray-100 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <h3 id="cat-modal-title" class="text-lg font-bold text-brand-darkNavy">Category</h3>
        <button onclick="closeCategoryModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="category-form" onsubmit="handleSaveCategory(event)" class="space-y-4">
        <input type="hidden" id="cat-id" />
        
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Category Name</label>
          <input type="text" id="cat-name" required placeholder="ชื่อหมวดหมู่..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-brand-darkNavy focus:outline-none focus:ring-2 focus:ring-brand-navy" />
        </div>

        <!-- Category Icon Selector Grid -->
        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-2">Select Icon</label>
          <div id="cat-icon-grid" class="grid grid-cols-5 gap-2 bg-gray-50 p-2.5 rounded-xl border border-gray-200">
            <!-- Icon Items Will Render Via JS -->
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-brand-darkNavy mb-1">Icon Color</label>
          <div class="flex items-center gap-3">
            <input type="color" id="cat-color" value="#0c3d88" class="w-10 h-10 rounded-xl border-none cursor-pointer bg-transparent" />
            <span class="text-xs text-gray-500">เลือกสีสัญลักษณ์ประจำหมวดหมู่</span>
          </div>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeCategoryModal()" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-brand-darkNavy font-semibold py-2.5 rounded-xl text-sm transition-colors">Cancel</button>
          <button type="submit" id="save-cat-btn" class="w-1/2 bg-brand-navy hover:bg-blue-900 text-white font-semibold py-2.5 rounded-xl text-sm shadow-md transition-colors">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <!-- External Script Loaders -->
  <script src="js/core/config.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="app.js"></script>
  <script src="script.js"></script>
</body>
</html>
