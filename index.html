<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thosbook - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0c3d88',
              darkNavy: '#041c43',
              footerNavy: '#02132e',
              pageBg: '#e9ecef',
              placeholder: '#9b9b9b',
            }
          },
          fontFamily: {
            montserrat: ['Montserrat', 'sans-serif'],
            prompt: ['Prompt', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-pageBg font-montserrat min-h-screen flex flex-col justify-between">

  <header class="bg-brand-navy h-28 w-full shadow-md"></header>

  <main class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-sm space-y-6 text-center">
      <h1 class="text-4xl font-bold text-brand-darkNavy tracking-tight">Login</h1>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <input 
            type="text" 
            id="username"
            placeholder="User" 
            required
            class="w-full bg-white text-brand-darkNavy placeholder-brand-placeholder text-sm rounded-lg px-4 py-3 border-none focus:outline-none focus:ring-2 focus:ring-brand-navy shadow-sm"
          />
        </div>

        <div class="relative">
          <input 
            type="password" 
            id="password"
            placeholder="Password" 
            required
            class="w-full bg-white text-brand-darkNavy placeholder-brand-placeholder text-sm rounded-lg px-4 py-3 border-none focus:outline-none focus:ring-2 focus:ring-brand-navy shadow-sm pr-10"
          />
          <button type="button" onclick="togglePassword()" class="absolute right-3 top-3 text-brand-darkNavy hover:text-brand-navy">
            <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
          </button>
        </div>

        <div id="error-message" class="text-xs text-red-500 font-medium hidden"></div>

        <button 
          type="submit" 
          id="submit-btn"
          class="w-full bg-brand-navy hover:bg-blue-900 text-white font-semibold py-3 px-4 rounded-lg text-sm shadow-md transition-colors"
        >
          Login
        </button>
      </form>

      <div class="pt-2">
        <a href="#" class="inline-flex items-center gap-1.5 text-xs font-semibold text-brand-darkNavy hover:underline">
          <i data-lucide="info" class="w-3.5 h-3.5"></i>
          <span>Forgot Password</span>
        </a>
      </div>
    </div>
  </main>

  <footer class="bg-brand-footerNavy h-36 w-full"></footer>

  <script>
    lucide.createIcons();

    const GAS_API_URL = "AKfycbyCCKruqnrzhPSzj35FLVWP9m7aEIuz7gSwVdj5sL6XHgiHf2frXb1lpwGwA6YidtAo"; // วาง URL เดียวกันกับหน้า Dashboard

    // เช็กว่าถ้า Login แล้วให้ไป Dashboard ทันที
    if (localStorage.getItem("thosbook_user")) {
      window.location.href = "dashboard.html";
    }

    function togglePassword() {
      const passInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eye-icon");
      if (passInput.type === "password") {
        passInput.type = "text";
        eyeIcon.setAttribute("data-lucide", "eye-off");
      } else {
        passInput.type = "password";
        eyeIcon.setAttribute("data-lucide", "eye");
      }
      lucide.createIcons();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const userVal = document.getElementById("username").value;
      const passVal = document.getElementById("password").value;
      const errorDiv = document.getElementById("error-message");
      const submitBtn = document.getElementById("submit-btn");

      errorDiv.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.innerText = "Authenticating...";

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "login",
            username: userVal,
            password: passVal
          })
        });

        const data = await res.json();

        if (data.status === "success") {
          // บันทึก Session ลง LocalStorage
          localStorage.setItem("thosbook_user", JSON.stringify(data.user));
          window.location.href = "dashboard.html";
        } else {
          errorDiv.innerText = data.message || "Invalid credentials";
          errorDiv.classList.remove("hidden");
        }
      } catch (err) {
        errorDiv.innerText = "Connection error. Please try again.";
        errorDiv.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Login";
      }
    }
  </script>
</body>
</html>
