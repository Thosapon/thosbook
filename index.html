<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thosbook - Management System</title>
  
  <!-- Custom CSS Theme -->
  <link rel="stylesheet" href="css/theme.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone สำหรับแปลง JSX และ ES Modules บน Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  
  <!-- Single Page Application Root Element -->
  <div id="root"></div>

  <!-- Entry Point: เรียกใช้ React AppRouter ผ่าน Babel Transformer -->
  <script 
    type="text/babel" 
    data-presets="env,react"
    src="/src/router/AppRouter.jsx">
  </script>
</body>
</html>
